<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=>, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //push
      function push(array, element) {
        const temp = [];
        let i = 0;
        temp[i] = element;
        array.forEach((item) => {
          i++;
          temp[i] = item;
        });

        // 원본 배열 수정
        for (let j = 0; j < temp.length; j++) {
          array[j] = temp[j];
        }
      }
    </script>
  </body>
</html>
